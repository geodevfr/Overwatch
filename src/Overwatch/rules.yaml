# Table de détection — Dofus 3 (remake Unity, Ankama).
#
# Le protocole est régénéré à chaque mise à jour : les codes de messages ET
# les numéros de champs changent. Aucune de ces valeurs n'est dans le code.
# Overwatch ne les devine pas.
#
# Chaque version reste status: unknown tant qu'une capture locale n'a pas
# confirmé ses signatures. Une signature écrite sous une version unknown
# est ignorée, même si enabled vaut true. Pour l'activer :
#   1. coller les préfixes et les offsets observés dans rules, pour CETTE version
#   2. passer status à captured
# Le fichier est relu à chaud. Une erreur de syntaxe conserve la table précédente.
#
# pending nomme ce qu'une capture devra remplir. Ce ne sont pas des opcodes.

version: 1
client: dofus3
detection:
  - version: "3.6.8.8"
    status: unknown
    pending:
      - average_prices
      - sale_lots
      - server_name
      - character_name
      - position
      - combat
    rules: []

  - version: "3.6.9.9"
    status: unknown
    pending:
      - average_prices
      - sale_lots
      - server_name
      - character_name
      - position
      - combat
    rules: []

  - version: "3.6.11.13"
    status: unknown
    pending:
      - average_prices
      - sale_lots
      - server_name
      - character_name
      - position
      - combat
    rules: []

rules: []
